<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1680" height="940" fill="#FAF7F2"/><rect x="0" y="0" width="1680" height="64" fill="#1F2937"/><text x="36" y="34" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start">Data Flow — Place Order</text><text x="36" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#C9CDD6" text-anchor="start">From customer checkout to live kitchen / admin / rider updates</text><text x="1644" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#EA580C" text-anchor="end">Reshee Tech</text><text x="1644" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#C9CDD6" text-anchor="end">Multi-tenant food delivery platform</text><rect x="40" y="110" width="250" height="80" rx="12" fill="#FFFFFF" stroke="#D8D2C7" stroke-width="1.5"/><text x="165.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Customer</text><text x="165.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">cart + checkout</text><line x1="290" y1="150" x2="360" y2="150" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/><rect x="264.6" y="132.0" width="120.8" height="18" rx="9" fill="#FAF7F2" opacity="0.95"/><text x="325.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="#2563EB" text-anchor="middle">POST /api/orders</text><rect x="360" y="110" width="300" height="80" rx="12" fill="#E0EAFF" stroke="#2563EB" stroke-width="1.5"/><text x="510.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">orders API</text><text x="510.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">zod-validated body</text><line x1="660" y1="150" x2="730" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="648.2" y="132.0" width="93.6" height="18" rx="9" fill="#FAF7F2" opacity="0.95"/><text x="695.0" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">placeOrder()</text><rect x="730" y="96" width="910" height="200" rx="14" fill="#EDE4FF" stroke="#7C3AED" stroke-width="1.5"/><text x="748" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#7C3AED" text-anchor="start">placeOrder (server-authoritative)</text><text x="752" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">1. resolve menu items + variants/modifiers</text><text x="752" y="163" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">2. apply happy-hour, offers, coupons, wallet, loyalty</text><text x="752" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">3. fulfillment: delivery / pickup / dine-in / scheduled</text><text x="752" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">4. freebie grant (atomic stock decrement)</text><text x="752" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">5. price + tax + delivery fee → totals</text><text x="752" y="263" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">6. create Order + items in one transaction</text><line x1="1185" y1="296" x2="1185" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1158.6" y="304.0" width="52.8" height="18" rx="9" fill="#FAF7F2" opacity="0.95"/><text x="1185.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">commit</text><rect x="980" y="348" width="420" height="72" rx="12" fill="#FFFFFF" stroke="#D8D2C7" stroke-width="1.5"/><text x="1190.0" y="374" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">PostgreSQL</text><text x="1190.0" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Order = RECEIVED</text><line x1="980" y1="384" x2="722" y2="384" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="821.2" y="366.0" width="59.6" height="18" rx="9" fill="#FAF7F2" opacity="0.95"/><text x="851.0" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">publish</text><rect x="360" y="348" width="360" height="150" rx="14" fill="#E0EAFF" stroke="#2563EB" stroke-width="1.5"/><text x="378" y="374" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="start">Realtime SSE bus</text><text x="384" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#2563EB" text-anchor="start">branch:{id}:orders</text><text x="384" y="424" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#2563EB" text-anchor="start">group:{root}:orders</text><text x="384" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#2563EB" text-anchor="start">order:{id}  ·  rider:pool</text><line x1="540" y1="498" x2="540" y2="556" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="556" width="360" height="80" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="540.0" y="582" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Kitchen board</text><text x="540.0" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">New → Preparing → Ready</text><line x1="820" y1="420" x2="840" y2="556" stroke="#334155" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="760" y="556" width="360" height="80" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="940.0" y="582" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Admin orders</text><text x="940.0" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">group-wide, labelled</text><line x1="1300" y1="420" x2="1300" y2="556" stroke="#334155" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="1266.8" y="470.0" width="66.4" height="18" rx="9" fill="#FAF7F2" opacity="0.95"/><text x="1300.0" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">on READY</text><rect x="1160" y="556" width="420" height="80" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="1370.0" y="582" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="middle">Rider pool → assignment</text><text x="1370.0" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">push + claim, GPS</text><rect x="40" y="676" width="1600" height="72" rx="14" fill="#FCEFD6" stroke="#B45309" stroke-width="1.5"/><text x="64" y="704" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B45309" text-anchor="start">Sync safety net</text><text x="64" y="728" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">SSE is the fast path; every board also polls a snapshot every 15s + on tab-focus, so an order is never invisible even if the live stream drops.</text><rect x="40" y="766" width="1600" height="138" rx="14" fill="#FFFFFF" stroke="#D8D2C7" stroke-width="1.5"/><text x="64" y="794" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="start">Order state machine</text><rect x="64" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="162.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">PAYMENT_PENDING</text><line x1="260" y1="837" x2="274" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="274" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="372.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">RECEIVED</text><line x1="470" y1="837" x2="484" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="484" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="582.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">ACCEPTED</text><line x1="680" y1="837" x2="694" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="694" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="792.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">PREPARING</text><line x1="890" y1="837" x2="904" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="904" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="1002.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">READY</text><line x1="1100" y1="837" x2="1114" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1114" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="1212.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">OUT_FOR_DELIVERY</text><line x1="1310" y1="837" x2="1324" y2="837" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1324" y="820" width="196" height="34" rx="17.0" fill="#E5E9F0"/><text x="1422.0" y="841.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle">DELIVERED</text><text x="64" y="884" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#6B7280" text-anchor="start">+ failure / recovery: PAYMENT_FAILED · DELIVERY_OTP_FAILED · CUSTOMER_UNREACHABLE · CANCELLED_BY_* · REFUND_*</text></svg>