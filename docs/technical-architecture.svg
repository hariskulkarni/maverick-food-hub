<rect x="0" y="0" width="2400" height="1900" fill="#f5f1e8" rx="0" ry="0" opacity="1"/>
<text x="160" y="60" font-size="20" fill="#8c8780" font-weight="500" text-anchor="start" letter-spacing="8">FOODHUB · TECHNICAL ARCHITECTURE</text>
<text x="160" y="158" font-size="78" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-1.5">One Next.js app.</text>
<text x="160" y="242" font-size="78" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-1.5">Six layers, type-safe end to end.</text>
<line x1="160" y1="266" x2="300" y2="266" stroke="#161b21" stroke-width="3" opacity="1"/>
<text x="160" y="302" font-size="22" fill="#3a4148" font-weight="400" text-anchor="start" letter-spacing="0.3">TypeScript everywhere · Postgres + Prisma · Server Actions + SSE · NextAuth v5 · Tailwind · Docker.</text>
<text x="160" y="330" font-size="22" fill="#3a4148" font-weight="400" text-anchor="start" letter-spacing="0.3">Multi-tenant data access scoped through a single tenancy module. Realtime via in-process EventEmitter, swappable for Postgres LISTEN/NOTIFY.</text>
