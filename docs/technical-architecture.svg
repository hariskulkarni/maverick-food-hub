<text x="182" y="1847" font-size="14" fill="#161b21" font-weight="400" text-anchor="start" letter-spacing="0.0">Auth (NextAuth v5 split: edge + node)  ·  Tenancy (currentRestaurant + requireSuperAdmin)  ·  Realtime SSE (rider:pool · order:* · branch:* · rider:*)  ·  Logging (Pino)  ·  Validation (Zod at every API boundary)  ·  Type-safety (Prisma-generated types end to end).</text>
