<text x="1700.6666666666667" y="1204" font-size="10" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Delivery proof photos</text>
<rect x="1943.3333333333335" y="1162" width="242.66666666666669" height="58" fill="#ffffff" rx="8" ry="8" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
