<text x="1957.3333333333335" y="1204" font-size="10" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Rider PWA → Play Store</text>
<rect x="160" y="1240" width="2080" height="80" fill="#fff6e8" rx="10" ry="10" opacity="1" stroke="#a06a1c" stroke-width="1"/>
<text x="180" y="1272" font-size="12" fill="#a06a1c" font-weight="700" text-anchor="start" letter-spacing="4">TENANCY</text>
<text x="180" y="1302" font-size="14" fill="#161b21" font-weight="400" text-anchor="start" letter-spacing="0.0">One platform · many restaurants (each a tenant) · one shared rider pool · one super-admin team.  Restaurants self-onboard at /signup/restaurant; riders self-apply at /signup/rider; both reviewed by the FoodHub team.</text>
