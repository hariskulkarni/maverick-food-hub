<rect x="0" y="0" width="2400" height="1800" fill="#f5f1e8" rx="0" ry="0" opacity="1"/>
<text x="160" y="60" font-size="20" fill="#8c8780" font-weight="500" text-anchor="start" letter-spacing="8">FOODHUB · SYSTEM ARCHITECTURE</text>
<text x="160" y="158" font-size="78" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-1.5">The marketplace, as a system.</text>
<line x1="160" y1="182" x2="300" y2="182" stroke="#161b21" stroke-width="3" opacity="1"/>
<text x="160" y="218" font-size="22" fill="#3a4148" font-weight="400" text-anchor="start" letter-spacing="0.3">Four audiences. One platform engine. A shared rider pool.</text>
<text x="160" y="246" font-size="22" fill="#3a4148" font-weight="400" text-anchor="start" letter-spacing="0.3">Multi-tenant from day one; restaurants and riders both onboard themselves and are approved by the FoodHub team.</text>
<rect x="176.0" y="380" width="488.0" height="4" fill="#1f3a73" rx="0" ry="0" opacity="1"/>
<text x="420.0" y="418" font-size="30" fill="#161b21" font-weight="600" text-anchor="middle" letter-spacing="-0.4">Customer</text>
<text x="420.0" y="444" font-size="14" fill="#8c8780" font-weight="400" text-anchor="middle" letter-spacing="0.3">Discovers · orders · tracks · tips</text>
<rect x="696.0" y="380" width="488.0" height="4" fill="#a35e1d" rx="0" ry="0" opacity="1"/>
<text x="940.0" y="418" font-size="30" fill="#161b21" font-weight="600" text-anchor="middle" letter-spacing="-0.4">Restaurant</text>
<text x="940.0" y="444" font-size="14" fill="#8c8780" font-weight="400" text-anchor="middle" letter-spacing="0.3">Onboards · serves · cooks</text>
<rect x="1216.0" y="380" width="488.0" height="4" fill="#2f6b3a" rx="0" ry="0" opacity="1"/>
<text x="1460.0" y="418" font-size="30" fill="#161b21" font-weight="600" text-anchor="middle" letter-spacing="-0.4">Rider</text>
<text x="1460.0" y="444" font-size="14" fill="#8c8780" font-weight="400" text-anchor="middle" letter-spacing="0.3">Claims · delivers · earns</text>
<rect x="1736.0" y="380" width="488.0" height="4" fill="#4a3a6a" rx="0" ry="0" opacity="1"/>
<text x="1980.0" y="418" font-size="30" fill="#161b21" font-weight="600" text-anchor="middle" letter-spacing="-0.4">Platform team</text>
<text x="1980.0" y="444" font-size="14" fill="#8c8780" font-weight="400" text-anchor="middle" letter-spacing="0.3">Approves · prices · oversees</text>
<rect x="174.0" y="520" width="492.0" height="160" fill="#ffffff" rx="14" ry="14" opacity="1" stroke="#1f3a73" stroke-width="0.7"/>
<rect x="174.0" y="520" width="6" height="160" fill="#1f3a73" rx="2" ry="2" opacity="1"/>
<text x="196.0" y="556" font-size="22" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-0.3">Customer web + PWA</text>
<text x="196.0" y="590" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">Marketplace home → restaurant pages →</text>
<text x="196.0" y="612" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">checkout → live tracker → tip card</text>
<rect x="694.0" y="520" width="492.0" height="160" fill="#ffffff" rx="14" ry="14" opacity="1" stroke="#a35e1d" stroke-width="0.7"/>
<rect x="694.0" y="520" width="6" height="160" fill="#a35e1d" rx="2" ry="2" opacity="1"/>
<text x="716.0" y="556" font-size="22" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-0.3">Restaurant admin</text>
<text x="716.0" y="590" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">Live orders → KOT → branch + menu</text>
<text x="716.0" y="612" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">admin → exportable reports</text>
<rect x="1214.0" y="520" width="492.0" height="160" fill="#ffffff" rx="14" ry="14" opacity="1" stroke="#2f6b3a" stroke-width="0.7"/>
<rect x="1214.0" y="520" width="6" height="160" fill="#2f6b3a" rx="2" ry="2" opacity="1"/>
<text x="1236.0" y="556" font-size="22" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-0.3">Rider PWA + Capacitor</text>
<text x="1236.0" y="590" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">Online toggle → order pool → claim →</text>
<text x="1236.0" y="612" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">GPS → photo proof → earnings</text>
<rect x="1734.0" y="520" width="492.0" height="160" fill="#ffffff" rx="14" ry="14" opacity="1" stroke="#4a3a6a" stroke-width="0.7"/>
<rect x="1734.0" y="520" width="6" height="160" fill="#4a3a6a" rx="2" ry="2" opacity="1"/>
<text x="1756.0" y="556" font-size="22" fill="#161b21" font-weight="600" text-anchor="start" letter-spacing="-0.3">Platform super-admin</text>
<text x="1756.0" y="590" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">Restaurant approvals → rider approvals →</text>
<text x="1756.0" y="612" font-size="14" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.2">payout rules → deep analytics</text>
<rect x="160" y="730" width="2080" height="360" fill="#ffffff" rx="22" ry="22" opacity="1" stroke="#cfc8b9" stroke-width="1.4"/>
<text x="190" y="768" font-size="14" fill="#a06a1c" font-weight="700" text-anchor="start" letter-spacing="4">PLATFORM ENGINE</text>
<text x="190" y="808" font-size="26" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="-0.3">One codebase. Multi-tenant. Built on open standards.</text>
<text x="190" y="838" font-size="16" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Every audience above is the same engine, dressed for its job.</text>
<rect x="190.0" y="870" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="206.0" y="898" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Catalog</text>
<text x="206.0" y="920" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Menus, categories, combos.</text>
<text x="206.0" y="936" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Top-sellers ad strip computed nightly.</text>
<rect x="863.3333333333334" y="870" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="879.3333333333334" y="898" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Order machine</text>
<text x="879.3333333333334" y="920" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Strict status flow: Received → Accepted → Preparing → Ready → Out → Delivered.</text>
<text x="879.3333333333334" y="936" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">State transitions enforced server-side.</text>
<rect x="1536.6666666666667" y="870" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="1552.6666666666667" y="898" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Rider pool</text>
<text x="1552.6666666666667" y="920" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Platform-wide, NOT restaurant-scoped.</text>
<text x="1552.6666666666667" y="936" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">READY orders enter the pool.</text>
<text x="1552.6666666666667" y="952" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">First online rider claims them.</text>
<rect x="190.0" y="981" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="206.0" y="1009" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Payments</text>
<text x="206.0" y="1031" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Razorpay · COD · Wallet · Loyalty.</text>
<text x="206.0" y="1047" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Tipping post-delivery (100% to rider).</text>
<rect x="863.3333333333334" y="981" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="879.3333333333334" y="1009" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Engagement</text>
<text x="879.3333333333334" y="1031" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Loyalty points, wallet, referrals,</text>
<text x="879.3333333333334" y="1047" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">coupons, peak-hour + rain bonuses.</text>
<rect x="1536.6666666666667" y="981" width="657.3333333333334" height="95" fill="#fafaf6" rx="10" ry="10" opacity="1" stroke="#cfc8b9" stroke-width="0.6"/>
<text x="1552.6666666666667" y="1009" font-size="17" fill="#161b21" font-weight="700" text-anchor="start" letter-spacing="0.0">Analytics</text>
<text x="1552.6666666666667" y="1031" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">Cross-tenant GMV, top restaurants/products,</text>
<text x="1552.6666666666667" y="1047" font-size="12" fill="#8c8780" font-weight="400" text-anchor="start" letter-spacing="0.0">payment mix, spend distribution, rider leaderboard.</text>
