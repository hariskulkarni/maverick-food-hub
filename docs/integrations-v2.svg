<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="1680" height="940" fill="#FAF7F2"/><rect x="0" y="0" width="1680" height="64" fill="#1F2937"/><text x="36" y="34" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" font-style="normal" fill="#FFFFFF" text-anchor="start">Third-Party Integrations</text><text x="36" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#C9CDD6" text-anchor="start">Every external service sits behind a swappable adapter with a mock default</text><text x="1644" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#EA580C" text-anchor="end">Reshee Tech</text><text x="1644" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#C9CDD6" text-anchor="end">Multi-tenant food delivery platform</text><rect x="640" y="110" width="400" height="150" rx="12" fill="#FCE7DA" stroke="#EA580C" stroke-width="1.5"/><text x="840.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#EA580C" text-anchor="middle">Reshee Tech</text><text x="656" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="start">• server/* adapter interfaces</text><text x="656" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="start">• mock impl for local dev</text><text x="656" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="start">• real keys at deploy time</text><line x1="840" y1="260" x2="320" y2="360" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="120" y="360" width="400" height="118" rx="12" fill="#E0EAFF" stroke="#2563EB" stroke-width="1.5"/><text x="320.0" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="middle">Razorpay</text><text x="320.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Payments</text><text x="320" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">create order · capture · webhook (signature verify)</text><line x1="840" y1="260" x2="840" y2="360" stroke="#15803D" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="640" y="360" width="400" height="118" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="840.0" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#15803D" text-anchor="middle">2Factor</text><text x="840.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">SMS / OTP</text><text x="840" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">login + delivery OTP (India); MSG91/Fast2SMS alt</text><line x1="840" y1="260" x2="1360" y2="360" stroke="#B45309" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="1160" y="360" width="400" height="118" rx="12" fill="#FCEFD6" stroke="#B45309" stroke-width="1.5"/><text x="1360.0" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B45309" text-anchor="middle">Google OAuth</text><text x="1360.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Customer sign-in</text><text x="1360" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">NextAuth provider; email→customer provisioning</text><line x1="840" y1="260" x2="320" y2="610" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="120" y="610" width="400" height="118" rx="12" fill="#EDE4FF" stroke="#7C3AED" stroke-width="1.5"/><text x="320.0" y="636" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#7C3AED" text-anchor="middle">OpenStreetMap</text><text x="320.0" y="654" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Maps (free)</text><text x="320" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">Leaflet tiles · address picker · live rider GPS</text><line x1="840" y1="260" x2="840" y2="610" stroke="#334155" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="640" y="610" width="400" height="118" rx="12" fill="#E5E9F0" stroke="#334155" stroke-width="1.5"/><text x="840.0" y="636" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle">S3-compatible</text><text x="840.0" y="654" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Object storage</text><text x="840" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">menu / KYC images via storage adapter</text><line x1="840" y1="260" x2="1360" y2="610" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="1160" y="610" width="400" height="118" rx="12" fill="#E0EAFF" stroke="#2563EB" stroke-width="1.5"/><text x="1360.0" y="636" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2563EB" text-anchor="middle">Expo Push</text><text x="1360.0" y="654" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#6B7280" text-anchor="middle">Rider notifications</text><text x="1360" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle">new-order push to the native Android app</text><rect x="40" y="772" width="1600" height="120" rx="14" fill="#FFFFFF" stroke="#D8D2C7" stroke-width="1.5"/><text x="64" y="802" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#1F2937" text-anchor="start">Why adapters</text><text x="64" y="828" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">Each integration is reached through a narrow interface, so local/dev runs fully on mocks (no keys, no spend) and production swaps in real</text><text x="64" y="850" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start">credentials via env. A provider can be replaced (e.g. 2Factor → MSG91) without touching call sites; failures are best-effort and never roll back a paid order.</text><text x="64" y="878" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" font-style="normal" fill="#6B7280" text-anchor="start">Config: DATABASE_URL · NEXTAUTH_SECRET · RAZORPAY_* · 2FACTOR_* · GOOGLE_CLIENT_* · STORAGE_DRIVER / S3_* · NEXT_PUBLIC_BRAND_NAME</text></svg>