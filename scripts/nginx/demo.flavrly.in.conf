# Nginx server block for the DEMO site (demo.flavrly.in).
#
# Place this at /etc/nginx/sites-available/demo.flavrly.in, symlink into
# sites-enabled, then run certbot for SSL:
#   sudo certbot --nginx -d demo.flavrly.in
#
# The demo pm2 process listens on :3001 (see ecosystem.config.js).

server {
    listen 80;
    listen [::]:80;
    server_name demo.flavrly.in;

    # Certbot will inject SSL + 301 → https here automatically.

    # Smaller request size — demo doesn't need huge uploads.
    client_max_body_size 10M;

    # Gzip for the small static stuff served from /downloads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_read_timeout 90s;
    }

    # SSE / streamed routes — disable buffering so events flow in real-time.
    location ~ ^/api/(events|admin/.*/stream) {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        chunked_transfer_encoding off;
    }
}
