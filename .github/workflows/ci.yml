name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Empty scratch DB for `prisma migrate diff` (drift check); never holds data.
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      # Apply the committed, versioned migrations to the fresh CI database exactly as
      # production would (never `db push`, which hides missing migrations).
      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy

      - name: Create shadow database for drift check
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_shadow'

      # Fails (exit 2) if schema.prisma contains anything the migrations do not create.
      - name: Migration drift check (migrations == schema.prisma)
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Responsive guardrail
        run: npm run check:responsive

      - name: Unit tests
        run: npm run test:ci

      # Real-Postgres tests (uniqueness, row locks, allocation) against the migrated CI DB.
      - name: DB integration tests
        run: npm run test:db

      - name: Build
        run: |
          ulimit -n 8192 || true
          npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full git history so gitleaks can scan past commits

      - name: Secret scan (gitleaks)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          # Scans the working tree AND git history; fails the job if any secret is found.
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Dependency audit (apps/web)
        working-directory: apps/web
        # Reports High/Critical advisories. Non-blocking for now so a transitive
        # advisory can't stop deploys — tighten to blocking once the tree is clean.
        # Always writes a JSON report (artifact) and a severity summary to the job summary.
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const v=(require("./npm-audit.json").metadata||{}).vulnerabilities||{};console.log("### npm audit (apps/web)\n\n| severity | count |\n|---|---|\n"+Object.entries(v).map(([k,n])=>"| "+k+" | "+n+" |").join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-apps-web
          path: apps/web/npm-audit.json
          if-no-files-found: warn

  rider-native:
    name: Rider app (apps/rider-native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/rider-native/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
