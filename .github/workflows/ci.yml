name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Placeholders so `prisma generate` + `next build` run without a live DB.
      # No migrations/queries are executed at build time (pages are force-dynamic),
      # so a dummy connection string is sufficient and never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        # Raise the open-file limit: Next.js opens many descriptors while
        # collecting page data for a large route tree and can otherwise hit
        # EMFILE on runners with a low soft limit.
        run: |
          ulimit -n 8192 || true
          npm run build

  rider-native:
    name: Rider app (apps/rider-native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/rider-native/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
