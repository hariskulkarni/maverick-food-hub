name: Deploy to VPS
# C14.1: deploy must never run on a push that failed CI. It triggers only after
# the "CI" workflow (typecheck, lint, tests, gitleaks) completes successfully on
# main, or on a manual dispatch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply schema migration on the VPS (pass --migrate)"
        type: boolean
        default: false
# T-24: least-privilege token; the job only talks to the VPS over SSH.
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    # Only deploy on a successful CI run, or an explicit manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Configure SSH
        # T-24: the VPS host key comes from the VPS_KNOWN_HOSTS secret (pinned
        # known_hosts lines), never from ssh-keyscan on a fresh runner (TOFU).
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret is not set. Add the VPS host key line(s) (see docs/flavrly-pg/DEPLOYMENT_AND_ROLLBACK.md §3)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy over SSH (with retry)
        env:
          APP_DIR: ${{ vars.APP_DIR || '/opt/restaurant-manager' }}
          # C14.2: schema changes are applied only on an explicit manual dispatch
          # with migrate=true. On every other deploy, deploy-remote.sh detects a
          # pending schema change and fails loudly rather than running new code
          # against the old schema.
          MIGRATE_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.migrate) && '--migrate' || '' }}
        run: |
          for attempt in 1 2 3; do
            echo "== deploy attempt $attempt =="
            if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                 -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                 "bash -lc 'cd ${APP_DIR} && git fetch origin main && git reset --hard origin/main && ./scripts/deploy-remote.sh ${MIGRATE_FLAG}'"; then
              echo "deploy ok on attempt $attempt"; exit 0
            fi
            echo "attempt $attempt failed; retrying in 15s"; sleep 15
          done
          echo "all attempts failed"; exit 1
      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "curl -fsS --max-time 8 http://127.0.0.1:3000/api/system/health >/dev/null && echo healthy"
