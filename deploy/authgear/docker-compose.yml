# ─────────────────────────────────────────────────────────────────────────────
#  Authgear sandbox — DEPENDENCIES ONLY
#
#  PLEASE READ deploy/authgear/README.md BEFORE USING THIS FILE.
#
#  Authgear's open-source distribution does NOT publish public Docker images
#  for the Authgear server binary itself — only the dependency stack. To run
#  Authgear locally you must clone https://github.com/authgear/authgear-server
#  and `make build` it from source.
#
#  For "just exploring" Authgear's features, the strongly recommended path is
#  the Authgear Cloud free tier at https://www.authgear.com — same OIDC
#  integration in apps/web/src/server/auth.ts works against it identically,
#  no local infra needed. The Cloud path is documented as Path 1 in the
#  README; this docker-compose only matters if you go down Path 2 (self-host).
#
#  This file brings up Postgres + Redis on docker so that if you DO build
#  Authgear from source, you have the data backing services ready. The Go
#  binary then runs on your host and connects to localhost:5432 / :6379.
#
#  Run:
#    docker compose -f deploy/authgear/docker-compose.yml up -d
#  Tear down (keep data):
#    docker compose -f deploy/authgear/docker-compose.yml down
#  Tear down + wipe:
#    docker compose -f deploy/authgear/docker-compose.yml down -v
# ─────────────────────────────────────────────────────────────────────────────

networks:
  authgear:
    name: authgear

volumes:
  authgear-pg-data:
    name: authgear-pg-data
  authgear-redis-data:
    name: authgear-redis-data

services:
  # ───────── Postgres — Authgear's own database (separate from rm-postgres) ─────────
  # Authgear ships its own schema and migrations; do NOT point it at the
  # Restaurant Manager database. Authgear owns this DB top-to-bottom.
  # Exposed on host port 5433 so it can't collide with a local rm-postgres
  # on 5432. Update the Authgear `setup` config to point at this when you
  # configure the server.
  postgres-authgear:
    image: postgres:16-alpine
    container_name: authgear-postgres
    restart: unless-stopped
    networks: [authgear]
    environment:
      POSTGRES_USER: authgear
      POSTGRES_PASSWORD: authgear_local_password
      POSTGRES_DB: authgear
    ports:
      - "5433:5432"
    volumes:
      - authgear-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authgear"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────── Redis — session + rate-limit + nonce storage ─────────
  # Exposed on host port 6380 (instead of default 6379) to avoid collision
  # with a local Restaurant Manager Redis if one is running.
  redis-authgear:
    image: redis:7-alpine
    container_name: authgear-redis
    restart: unless-stopped
    networks: [authgear]
    ports:
      - "6380:6379"
    volumes:
      - authgear-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

# ─────────────────────────────────────────────────────────────────────────────
#  After bringing up these dependencies, your Authgear server (built from
#  source) needs to be told where to connect. The two connection strings
#  it'll want are:
#
#    DATABASE_URL = postgres://authgear:authgear_local_password@localhost:5433/authgear?sslmode=disable
#    REDIS_URL    = redis://localhost:6380
#
#  Set those in the Authgear server's runtime config (typically authgear.yaml
#  or environment variables for the binary). See the Authgear docs for the
#  exact key names.
# ─────────────────────────────────────────────────────────────────────────────
