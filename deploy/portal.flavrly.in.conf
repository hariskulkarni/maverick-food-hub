# ─────────────────────────────────────────────────────────────────────────────
#  Flavrly — STAFF PORTAL vhost (portal.flavrly.in)
#
#  Same Next.js app as flavrly.in (upstream 127.0.0.1:3000). The app decides
#  what to serve by the Host header: portal.flavrly.in exposes only the staff
#  areas (/platform, /admin, /kitchen) + /login; customer pages 301 back to
#  flavrly.in. Sessions are host-only cookies, so portal logins are isolated
#  from the customer site.
#
#  Install:
#    sudo cp deploy/portal.flavrly.in.conf /etc/nginx/sites-available/portal.flavrly.in
#    sudo ln -sf /etc/nginx/sites-available/portal.flavrly.in /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d portal.flavrly.in     # injects the 443 ssl block + http→https redirect
#
#  DNS: add an A record  portal.flavrly.in -> 148.230.66.124  first.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name portal.flavrly.in;

    # Certbot injects the SSL listener + HTTP→HTTPS redirect here.

    # Admins upload menu images / KYC docs / short clips — allow room.
    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # SSE / streamed routes (kitchen + admin order boards) — no buffering.
    location ~ ^/api/(events|.*/stream) {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;   # app sees portal.flavrly.in
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;   # NextAuth trustHost → secure cookies
        proxy_set_header X-Forwarded-Host   $host;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;   # CRITICAL: app splits on this
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_read_timeout 90s;
    }
}
