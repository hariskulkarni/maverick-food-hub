# ─────────────────────────────────────────────────────────────────────────────
#  Restaurant Manager — single-VPS nginx site
#
#  - Proxies all traffic to Node (Next.js) on 127.0.0.1:3000
#  - Disables buffering on /api/events (SSE / long-poll stream)
#  - Serves /uploads/ directly from disk (sharp-resized images)
#  - gzip on for text/* and JSON
#  - 10MB max body for menu image uploads
#  - Trusts Cloudflare proxy IPs so $remote_addr is the real client IP
#  - HTTPS is terminated by Cloudflare; origin runs on :80 only
#
#  Drop this file at /etc/nginx/sites-available/restaurant-manager and
#  symlink into /etc/nginx/sites-enabled.
# ─────────────────────────────────────────────────────────────────────────────

# Cloudflare IPv4 ranges (refresh from https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Upstream pool — single node for now, easy to scale to PM2 cluster mode.
upstream restaurant_manager {
    server 127.0.0.1:3000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Body size — menu/dish/logo image uploads
    client_max_body_size 10M;
    client_body_buffer_size 256k;
    client_body_timeout 30s;
    keepalive_timeout 65;

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/rm.access.log;
    error_log  /var/log/nginx/rm.error.log warn;

    # ── gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Static uploads — served directly from disk ──────────────────────────
    location /uploads/ {
        alias /var/www/restaurant-manager/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SSE / EventSource — disable proxy buffering ─────────────────────────
    location /api/events {
        proxy_pass http://restaurant_manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # critical — no buffering, flush every chunk to the client
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── Next.js static assets — long cache ──────────────────────────────────
    location /_next/static/ {
        proxy_pass http://restaurant_manager;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health probe (proxied through to /api/system/health) ───────────────
    location = /healthz {
        proxy_pass http://restaurant_manager/api/system/health;
        access_log off;
    }

    # ── Everything else → Node ──────────────────────────────────────────────
    location / {
        proxy_pass http://restaurant_manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
